id = "flatcircle"
name = "Flatcircle"
version = "0.4.0"
min_herdr_version = "0.9.1"
description = "One coordinator, a worktree and agent per bead, beads as the only record."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[startup]]
command = ["bin/flatcircle", "startup"]

[[actions]]
id = "configure"
title = "Flatcircle: set up (config for this workspace's repo, CLI link, agent view)"
contexts = ["workspace"]
command = ["bin/flatcircle", "configure"]

[[actions]]
id = "board"
title = "Flatcircle: board"
contexts = ["global", "workspace"]
command = ["bin/flatcircle", "action", "board"]

[[actions]]
id = "coordinator"
title = "Flatcircle: open the coordinator"
contexts = ["global", "workspace"]
command = ["bin/flatcircle", "coordinator"]

[[actions]]
id = "focus-clipboard"
title = "Flatcircle: focus or start the bead on the clipboard"
contexts = ["global", "workspace"]
command = ["bin/flatcircle", "focus"]

[[actions]]
id = "focus-clipboard-codex"
title = "Flatcircle: focus or start the bead on the clipboard (Codex)"
contexts = ["global", "workspace"]
command = ["bin/flatcircle", "focus", "--agent", "codex"]

[[panes]]
id = "board"
title = "Flatcircle"
placement = "popup"
width = "85%"
height = "80%"
command = ["bin/flatcircle", "board"]
