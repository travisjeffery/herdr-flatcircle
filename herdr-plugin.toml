id = "kelpie"
name = "Kelpie"
version = "0.3.0"
min_herdr_version = "0.9.1"
description = "One coordinator, a worktree and agent per bead, beads as the only record."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[startup]]
command = ["bin/kelpie", "startup"]

[[actions]]
id = "configure"
title = "Kelpie: set up (config for this workspace's repo, CLI link, agent view)"
contexts = ["workspace"]
command = ["bin/kelpie", "configure"]

[[actions]]
id = "board"
title = "Kelpie: board"
contexts = ["global", "workspace"]
command = ["bin/kelpie", "action", "board"]

[[actions]]
id = "coordinator"
title = "Kelpie: open the coordinator"
contexts = ["global", "workspace"]
command = ["bin/kelpie", "coordinator"]

[[actions]]
id = "focus-clipboard"
title = "Kelpie: focus or start the bead on the clipboard"
contexts = ["global", "workspace"]
command = ["bin/kelpie", "focus"]

[[actions]]
id = "focus-clipboard-codex"
title = "Kelpie: focus or start the bead on the clipboard (Codex)"
contexts = ["global", "workspace"]
command = ["bin/kelpie", "focus", "--agent", "codex"]

[[panes]]
id = "board"
title = "Kelpie"
placement = "popup"
width = "85%"
height = "80%"
command = ["bin/kelpie", "board"]
