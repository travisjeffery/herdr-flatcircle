name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The plugin's build step downloads the release named by the manifest's
      # version, so a tag that disagrees with it would ship binaries nobody
      # downloads.
      - name: Check the tag matches herdr-plugin.toml
        run: |
          want="v$(sed -n 's/^version *= *"\(.*\)"/\1/p' herdr-plugin.toml | head -n1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but herdr-plugin.toml says $want"; exit 1; }

      - run: go vet ./... && go test ./...

      - name: Build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
              -o "dist/shepherd-$os-$arch" .
          done
          cd dist && sha256sum shepherd-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
